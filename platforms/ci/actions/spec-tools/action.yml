# The agent-rules-kit spec validators as a composite action (KIT-081 stage 1). A project's CI runs the kit's
# validators and schemas from the commit its `uses:` line pins, so the project carries no copy:
#   uses: ChristianPrzybulinski/agent-rules-kit/platforms/ci/actions/spec-tools@<40-character SHA>  # vX.Y.Z
# Every path below starts at this action's own checkout ($GITHUB_ACTION_PATH); nothing fetches another ref.
# README.md in this folder lists the inputs.
name: agent-rules-kit spec tools
description: Runs the agent-rules-kit spec validators on docs/spec from the pinned kit commit, with no copy in the project.
inputs:
  checks:
    description: >-
      Comma-separated checks to run. spec: check_spec.py and check_docs_structure.py on docs/spec, and on a pull
      request the baseline that may only shrink. trace: spec_trace.py check. rows: row_checks.py check, --changed on a
      pull request and --all otherwise. none: only Python and AI_KIT_DIR, for a caller that runs a kit tool itself.
    required: false
    default: spec
  base:
    description: >-
      The pull request's base commit: the baseline step reads docs/spec/baseline.json there and the row checks diff
      from it. The caller's checkout needs fetch-depth 0.
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  head:
    description: The pull request's head commit, where the row checks diff to.
    required: false
    default: ${{ github.event.pull_request.head.sha }}
  profile:
    description: >-
      The project profile (KIT-087), relative to the repository root. platforms/tools/profile.py resolves it, falling
      back to the legacy homes for each key it does not set, and the action exports the resolved view as JSON in
      AI_KIT_PROFILE_JSON. A missing file resolves every key from its legacy home or default, with a warning.
    required: false
    default: .ai-kit.yaml
runs:
  using: composite
  steps:
    - id: checks
      name: Resolve the requested checks
      shell: bash
      env:
        CHECKS: ${{ inputs.checks }}
      run: |
        set -f
        for check in $(printf '%s' "$CHECKS" | tr ',' ' '); do
          case "$check" in
            spec|trace|rows) echo "$check=true" >> "$GITHUB_OUTPUT" ;;
            none) ;;
            *) echo "::error::spec-tools: unknown check '$check' (spec, trace, rows or none)"; exit 2 ;;
          esac
        done
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.12'
    - name: Install the validators' modules (pyyaml and jsonschema, for the full check)
      shell: bash
      run: python3 -m pip install --disable-pip-version-check --quiet pyyaml jsonschema
    # AI_KIT_DIR lets a later step of the job (a kit just module, pr_gates.py) run the kit at the pinned commit. zizmor's
    # github-env audit flags every write to GITHUB_ENV; a documented false positive here (CONTRIBUTING): the name is
    # fixed and the value is this action's own path on the runner, which no event payload or input reaches.
    - name: Export AI_KIT_DIR, the kit at this action's commit
      shell: bash
      run: |  # zizmor: ignore[github-env]
        echo "AI_KIT_DIR=$(cd "$GITHUB_ACTION_PATH/../../../.." && pwd)" >> "$GITHUB_ENV"
    # The resolved profile (KIT-087) for a later step of the job. An invalid profile, or a key set differently in
    # .ai-kit.yaml and a legacy home, fails here. The value is the resolver's JSON between a random delimiter, so no
    # line of the project's file can end it early and set another variable.
    - name: Resolve the project profile and export AI_KIT_PROFILE_JSON
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        json="$(python3 "$GITHUB_ACTION_PATH/../../../tools/profile.py" resolve --json --file "$PROFILE" .)"
        delim="ai_kit_profile_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
        { echo "AI_KIT_PROFILE_JSON<<$delim"; printf '%s\n' "$json"; echo "$delim"; } >> "$GITHUB_ENV"
    # A project justfile of its own may import a kit just module from ~/.ai-kit (KIT-081 stage 1b; the kit's templates
    # run the module from AI_KIT_DIR with -f, KIT-085): just reads no variable in
    # an import path, so the kit at this commit is linked there, unless the runner already holds a kit at that path.
    # Such a kit passes only at this action's commit (KIT-083): the HEAD of the action's checkout, or the SHA the caller
    # pins (github.action_ref), since a runner downloads an action as an archive without .git.
    - name: Link ~/.ai-kit to the kit at this action's commit (the justfile imports)
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: |
        kit="$(cd "$GITHUB_ACTION_PATH/../../../.." && pwd -P)"
        head_of() {  # the HEAD of the git checkout whose root is $1, else nothing
          top="$(git -C "$1" rev-parse --show-toplevel 2>/dev/null)" || return 0
          if [ "$(cd "$top" && pwd -P)" = "$(cd "$1" && pwd -P)" ]; then
            git -C "$1" rev-parse -q --verify HEAD || true
          fi
        }
        if [ ! -e "$HOME/.ai-kit" ] && [ ! -L "$HOME/.ai-kit" ]; then
          ln -s "$kit" "$HOME/.ai-kit"
        elif [ "$(cd "$HOME/.ai-kit" 2>/dev/null && pwd -P)" != "$kit" ]; then
          want="$(head_of "$kit")"
          if [ -z "$want" ] && printf '%s' "$ACTION_REF" | grep -Eqx '[0-9a-f]{40}'; then
            want="$ACTION_REF"
          fi
          have="$(head_of "$HOME/.ai-kit")"
          if [ -z "$want" ]; then
            echo "::error::spec-tools: $HOME/.ai-kit already exists and this action's commit is unknown (pin the action by its 40-character commit SHA), so a justfile importing ~/.ai-kit may run another kit"
            exit 1
          elif [ "$have" = "$want" ]; then
            echo "::notice::spec-tools: $HOME/.ai-kit is another checkout at this action's commit $want; a justfile importing ~/.ai-kit runs the same kit"
          else
            echo "::error::spec-tools: $HOME/.ai-kit is at ${have:-no git commit}, this action at $want, so a justfile importing ~/.ai-kit would run another kit; check out $want there, or remove $HOME/.ai-kit so the action links its own commit"
            exit 1
          fi
        fi
    - name: Validate frontmatter and FEAT/REQ references
      if: steps.checks.outputs.spec == 'true'
      shell: bash
      run: CI=1 python3 "$GITHUB_ACTION_PATH/../../validations/check_spec.py" docs/spec "$GITHUB_ACTION_PATH/../../schemas"
    # sdd.doc_structure (KIT-074): with enabled false the check prints "off" and passes, so no step needs a hand edit.
    - name: Every authored folder says what belongs in it (sdd.doc_structure)
      if: steps.checks.outputs.spec == 'true'
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../../validations/check_docs_structure.py"
    # docs/spec/baseline.json holds old findings and may only shrink (KIT-068): a pull request that adds an entry or
    # raises a value over its base commit fails here. With nothing to compare it says why (KIT-083).
    - name: Baseline only shrinks
      if: steps.checks.outputs.spec == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base }}
      run: |
        if [ -z "$BASE_SHA" ]; then
          echo "::notice::spec-tools: no base commit (the base input is empty); the baseline is not compared"
        elif ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
          echo "::warning::spec-tools: the base commit $BASE_SHA is not in the checkout (fetch-depth: 0 fetches it); the baseline is not compared"
        elif ! git cat-file -e "$BASE_SHA:docs/spec/baseline.json" 2>/dev/null; then
          echo "::notice::spec-tools: the base commit has no docs/spec/baseline.json; the baseline is not compared"
        else
          git show "$BASE_SHA:docs/spec/baseline.json" > "$RUNNER_TEMP/baseline-base.json"
          CI=1 python3 "$GITHUB_ACTION_PATH/../../validations/check_spec.py" \
            --baseline-against "$RUNNER_TEMP/baseline-base.json" docs/spec "$GITHUB_ACTION_PATH/../../schemas"
        fi
    - name: Journeys, FEAT and REQ symmetry and the traceability matrix (spec_trace.py check)
      if: steps.checks.outputs.trace == 'true'
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../../validations/spec_trace.py" check docs/spec
    - name: Open task rows (row_checks.py)
      if: steps.checks.outputs.rows == 'true'
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BASE_SHA: ${{ inputs.base }}
        HEAD_SHA: ${{ inputs.head }}
      run: |
        if [ "$EVENT" = pull_request ]; then
          python3 "$GITHUB_ACTION_PATH/../../validations/row_checks.py" check --changed "$BASE_SHA" "$HEAD_SHA"
        else
          python3 "$GITHUB_ACTION_PATH/../../validations/row_checks.py" check --all
        fi
