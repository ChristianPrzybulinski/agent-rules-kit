name: devstack

services:
  postgres:
    image: postgres:18
    command: postgres -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-devdb}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # the PG 18 image keeps its data under /var/lib/postgresql (versioned subdir);
      # a volume created by postgres:17 at /var/lib/postgresql/data is not reused
      - pgdata:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache/ephemeral store — uncomment only when a use-case DEC requires one.
  # valkey:
  #   image: valkey/valkey:8.1
  #   ports:
  #     - "127.0.0.1:6379:6379"
  #   volumes:
  #     - valkeydata:/data
  #   healthcheck:
  #     test: ["CMD", "valkey-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  pgdata:
