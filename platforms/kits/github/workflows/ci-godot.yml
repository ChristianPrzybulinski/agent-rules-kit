name: ci-godot

# Reusable Godot CI: the project copies this file to .github/workflows/ and calls it from its own
# workflow (`uses: ./.github/workflows/ci-godot.yml` — see README.md). Each step runs a recipe of the project's
# kit.just (agent-rules-kit sync-project.sh, godot profile at the repository root), so CI and a developer run the
# same command (KIT-074). The `changes` job decides what
# the diff needs: a docs-only diff skips import and tests; a diff it cannot compute (schedule,
# workflow_dispatch, new branch) runs everything (fail-open).

on:
  workflow_call:
    inputs:
      godot-version:
        type: string
        default: '4.7.2'
      test-runner:
        description: "'gdunit4' (default) or 'gut'"
        type: string
        default: 'gdunit4'
    outputs:
      code:
        description: "'true' when the diff touches more than docs"
        value: ${{ jobs.changes.outputs.code }}
      export:
        description: "'true' when the diff touches more than docs and tests/ — the caller's export job reads it"
        value: ${{ jobs.changes.outputs.export }}

permissions:
  contents: read

# Git LFS assets would reach Godot as pointer files, so each job checks out without LFS, restores
# .git/lfs from a cache keyed on the LFS object list and runs `git lfs pull`: unchanged assets cost
# no LFS bandwidth. barichello/godot-ci ships git-lfs.

jobs:
  changes:
    # GitHub counts a skipped job as success for a required check; this job is required itself because
    # a job skipped after a failed `needs` also reports success.
    runs-on: ubuntu-latest
    timeout-minutes: 5  # KIT-076: 3 × the longest measured green run (7 s), rounded up to 5 min
    outputs:
      code: ${{ steps.diff.outputs.code }}
      export: ${{ steps.diff.outputs.export }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          range=""
          if [ "$EVENT" = pull_request ]; then range="$PR_BASE...$PR_HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then range="$BEFORE..$AFTER"
          fi
          if [ -n "$range" ] && files=$(git diff --name-only "$range"); then
            printf '%s\n' "$files"
            docs='(^|/)[^/]+\.md$|^docs/|^changelog\.d/|^\.github/ISSUE_TEMPLATE/|^\.github/CODEOWNERS$|^LICENSE'
            # here-strings, not pipes: with pipefail, `grep -q` closing early can SIGPIPE the writer
            code=false; grep -Evq "$docs" <<< "$files" && code=true
            export=false; grep -Evq "$docs|^tests/" <<< "$files" && export=true
            echo "code=$code" >> "$GITHUB_OUTPUT"
            echo "export=$export" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no diff range for '$EVENT' — running every job"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "export=true" >> "$GITHUB_OUTPUT"
          fi

  import-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45  # KIT-076: 3 × the longest measured green run (828 s), rounded up to 5 min
    container: barichello/godot-ci:${{ inputs.godot-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: false
          # `git lfs pull` below authenticates with this credential; the job uploads only test-run.log and reports/
          persist-credentials: true
      - name: List LFS objects (cache key)
        # the container runs as root but the runner creates the workspace as uid 1001, and checkout trusts it
        # only in a temporary HOME: without safe.directory, git fails with "detected dubious ownership"
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Restore LFS cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Pull LFS objects
        run: git lfs pull
      - name: Install just (pinned, sha-256 checked; the recipes come from the project's kit.just)
        shell: bash
        env:
          JUST_VERSION: 1.58.0
          JUST_SHA256: 4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
        run: |
          set -euo pipefail
          wget -q -O "$RUNNER_TEMP/just.tar.gz" \
            "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$JUST_SHA256  $RUNNER_TEMP/just.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/just-bin"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/just-bin" just
          echo "$RUNNER_TEMP/just-bin" >> "$GITHUB_PATH"
      - name: Import and boot proof (just boot; the exit code of --quit is 0 after a script error, so the log decides)
        # `--quit` skips the import scan, so the recipe imports first: class_name scripts such as gdUnit4's
        # GdUnitTestCIRunner stay unregistered on a fresh checkout otherwise and the runner fails to load
        shell: bash
        run: just boot
      - name: Unit tests (just test; a missing runner, no suite or zero executed test cases fails)
        # container jobs default to `sh -e`; dash rejects `set -o pipefail` (exit 2)
        shell: bash
        env:
          GODOT_TEST_RUNNER: ${{ inputs.test-runner }}
        run: |
          set -euo pipefail
          just test 2>&1 | tee test-run.log
      - name: Upload test reports (JUnit XML and runner log)
        # gdUnit4 tees the run to test-run.log and writes reports/report_<n>/results.xml; the GUT branch leaves neither
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: godot-test-reports
          path: |
            test-run.log
            reports/
          if-no-files-found: warn

  lint:
    # outside the Godot container: the image has no pinned Python. gdformat has no exclusion flag
    # (only `excluded_directories` in gdformatrc, which this kit does not ship), so the recipe's find skips them
    runs-on: ubuntu-latest
    timeout-minutes: 5  # KIT-076: 3 × the longest measured green run (70 s), rounded up to 5 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-gdtoolkit.txt
      - name: Install just (pinned, sha-256 checked; the recipes come from the project's kit.just)
        shell: bash
        env:
          JUST_VERSION: 1.58.0
          JUST_SHA256: 4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
        run: |
          set -euo pipefail
          wget -q -O "$RUNNER_TEMP/just.tar.gz" \
            "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$JUST_SHA256  $RUNNER_TEMP/just.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/just-bin"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/just-bin" just
          echo "$RUNNER_TEMP/just-bin" >> "$GITHUB_PATH"
      - name: gdformat --check and gdlint (just lint; project scripts, addons/ and .godot/ left out)
        run: just lint
