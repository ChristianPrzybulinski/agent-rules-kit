name: ci-godot

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_IMAGE: barichello/godot-ci:4.7.2

jobs:
  import-and-test:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v7
      - name: Project import (generates .godot/, validates resources)
        run: godot --headless --path . --quit
      - name: GUT tests (if addons/gut exists)
        run: |
          if [ -d addons/gut ]; then
            godot --headless --path . -s addons/gut/gut_cmdln.gd -gexit
          else
            echo "addons/gut missing; skipping tests"
          fi

  export:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    container: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v7
      - name: Import
        run: godot --headless --path . --quit
      - name: Export Windows Desktop
        run: godot --headless --path . --export-release "Windows Desktop" build/windows/game.exe
      - name: Export macOS
        run: godot --headless --path . --export-release "macOS" build/macos/game.zip
      - uses: actions/upload-artifact@v7
        with:
          name: exports
          path: build/
