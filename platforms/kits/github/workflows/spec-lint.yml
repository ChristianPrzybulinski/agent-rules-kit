name: spec-lint

# Validates docs/spec with the agent-rules-kit spec tools (KIT-081): the composite action runs the kit's validators
# and schemas from the commit pinned below, so the project carries no copy of them. agent-rules-kit's
# platforms/tools/sync-project.sh writes this file with the kit commit it runs from; Dependabot or Renovate bumps the
# pin when the kit releases (agent-rules-kit platforms/kits/github/README.md). A pull request that bumps it changes
# only this file, so the paths below include it and the bump runs the check it updates.

on:
  push:
    paths: ['docs/spec/**', '.github/workflows/spec-lint.yml']
  pull_request:
    paths: ['docs/spec/**', '.github/workflows/spec-lint.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # KIT-076: 3 × the longest measured green run (60 s), rounded up to 5 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the baseline step reads the pull request's base commit
          persist-credentials: false
      # check_spec.py, check_docs_structure.py (it passes as "off" unless sdd.doc_structure.enabled) and, on a pull
      # request, the baseline that may only shrink (KIT-068). Add trace and rows to run spec_trace.py check and
      # row_checks.py too: checks: spec,trace,rows
      - name: Validate docs/spec with the kit's spec tools
        uses: ChristianPrzybulinski/agent-rules-kit/platforms/ci/actions/spec-tools@25a271e50af36ccff72ee8dd6c2923fe423cc99d  # v17.0.0
        with:
          checks: spec
