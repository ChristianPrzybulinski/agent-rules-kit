name: spec-lint

# Validates docs/spec locally — no agent-rules-kit checkout.
# The files in .github/spec-lint/ are a generated copy made by
# agent-rules-kit's platforms/tools/sync-project.sh; update by rerunning the sync.

on:
  push:
    paths: ['docs/spec/**', '.github/spec-lint/**']
  pull_request:
    paths: ['docs/spec/**', '.github/spec-lint/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - name: Validate frontmatter and FEAT/REQ references
        run: CI=1 python3 .github/spec-lint/check_spec.py docs/spec .github/spec-lint/schemas
