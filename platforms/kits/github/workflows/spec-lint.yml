name: spec-lint

# Validates docs/spec locally — no agent-rules-kit checkout.
# The files in .github/spec-lint/ are a generated copy made by
# agent-rules-kit's platforms/tools/sync-project.sh; update by rerunning the sync.

on:
  push:
    paths: ['docs/spec/**', '.github/spec-lint/**']
  pull_request:
    paths: ['docs/spec/**', '.github/spec-lint/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # KIT-076: 3 × the longest measured green run (60 s), rounded up to 5 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the baseline step reads the pull request's base branch
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - name: Validate frontmatter and FEAT/REQ references
        run: CI=1 python3 .github/spec-lint/check_spec.py docs/spec .github/spec-lint/schemas
      # docs/spec/baseline.json holds old findings and may only shrink (KIT-068): a pull request that adds an entry
      # or raises a value over its base branch fails here.
      - name: Baseline only shrinks
        if: github.event_name == 'pull_request'
        env: {BASE_REF: "${{ github.base_ref }}"}
        run: |
          if git cat-file -e "origin/$BASE_REF:docs/spec/baseline.json" 2>/dev/null; then
            git show "origin/$BASE_REF:docs/spec/baseline.json" > "$RUNNER_TEMP/baseline-base.json"
            CI=1 python3 .github/spec-lint/check_spec.py --baseline-against "$RUNNER_TEMP/baseline-base.json" docs/spec .github/spec-lint/schemas
          fi
