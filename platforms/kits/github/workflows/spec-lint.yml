name: spec-lint

# Valida docs/spec localmente — sem checkout do agent-rules-kit.
# Os arquivos em .github/spec-lint/ sao copia gerada por
# platforms/tools/sync-project.sh do agent-rules-kit; atualizar rodando o sync.

on:
  push:
    paths: ['docs/spec/**', '.github/spec-lint/**']
  pull_request:
    paths: ['docs/spec/**', '.github/spec-lint/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - name: Valida frontmatter e referências FEAT/REQ
        run: CI=1 python3 .github/spec-lint/check_spec.py docs/spec .github/spec-lint/schemas
