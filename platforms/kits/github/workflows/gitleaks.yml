name: gitleaks

# Secret scan with the gitleaks CLI at a pinned version and sha-256 (KIT-074): the whole history of the checked-out
# ref, a finding fails the job and the log redacts its value. The CLI, not gitleaks/gitleaks-action: in an
# organization's repository the action needs a GITLEAKS_LICENSE secret (a key from gitleaks.io) and exits 1 before
# scanning without one. Config: the `config` input (a path in the repository), else .gitleaks.toml at the root when
# present, else gitleaks' built-in rules; .gitleaksignore at the root (reviewed fingerprints) always applies.
# Copy to .github/workflows/ and keep the triggers your CI policy allows, or call it from another workflow
# (`uses: ./.github/workflows/gitleaks.yml` with `config:`). The local scan before a PR is agent-rules-kit's
# plugins/guardrails/skills/security/references/scan.md: `gitleaks git --redact --log-opts="origin/main..HEAD"`.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      config:
        description: "gitleaks config, a path in the repository ('' = .gitleaks.toml when present, else the built-in rules)"
        type: string
        default: ''
  workflow_call:
    inputs:
      config:
        description: "gitleaks config, a path in the repository ('' = .gitleaks.toml when present, else the built-in rules)"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the whole history, not only the tip
          persist-credentials: false
      - name: gitleaks (pinned CLI, sha-256 checked; whole history; values redacted)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          wget -q -O "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          args=(git --no-banner --redact -v --exit-code 1 --log-opts=HEAD)
          if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}" .
