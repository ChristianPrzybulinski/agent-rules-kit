name: gitleaks

# Secret scan with the agent-rules-kit gitleaks action (KIT-084): the gitleaks CLI at a pinned version and sha-256
# (KIT-074), from the kit commit pinned below, so the scan's logic and its pin stay in the kit and the project keeps one
# job per run. A pull request scans its own commits (base..head); a push and a dispatch scan the whole history of the
# checked-out ref. A finding fails the job and the log redacts its value. Config: the `config` input (a path in the
# repository), else .gitleaks.toml at the root when present, else gitleaks' built-in rules; .gitleaksignore at the root
# (reviewed fingerprints) always applies. The action, not gitleaks/gitleaks-action: in an organization's repository that
# action needs a GITLEAKS_LICENSE secret and exits 1 before scanning without one.
# Copy to .github/workflows/ and keep the triggers your CI policy allows, or call it from another workflow
# (`uses: ./.github/workflows/gitleaks.yml` with `config:`), or add the action as a step of an existing job. The action
# ships since 15.0.0: a pin older than that fails the scan step at its `uses:` line; the
# kit's Dependabot moves the pin, and a project's Dependabot or Renovate keeps it current (agent-rules-kit
# platforms/kits/github/README.md). The local scan before a PR is agent-rules-kit's
# plugins/guardrails/skills/security/references/scan.md: `gitleaks git --redact --log-opts="origin/main..HEAD"`.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      config:
        description: "gitleaks config, a path in the repository ('' = .gitleaks.toml when present, else the built-in rules)"
        type: string
        default: ''
  workflow_call:
    inputs:
      config:
        description: "gitleaks config, a path in the repository ('' = .gitleaks.toml when present, else the built-in rules)"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # KIT-076: 3 × the longest measured green run, rounded up to 5 min (the kit's full-history CLI scan: 10 s)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the whole history, and a pull request's base commit
          persist-credentials: false
      - name: gitleaks (the kit's action; pinned CLI, sha-256 checked; values redacted)
        uses: ChristianPrzybulinski/agent-rules-kit/platforms/ci/actions/gitleaks@61aca2e5faccd91bbe5d4677686e725f39c99843  # v16.0.0
        with:
          config: ${{ inputs.config }}
