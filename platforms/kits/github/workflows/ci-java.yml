name: ci-java

# Reusable Java CI: the project copies this file to .github/workflows/ and calls it from its own
# workflow (`uses: ./.github/workflows/ci-java.yml` — see README.md). Each step runs a recipe of the kit's java just
# module with the project at the repository root, `just -f "$AI_KIT_DIR/platforms/kits/just/java.just" -d . <recipe>`,
# the command skill sdd-implement runs for a developer, so both run the same recipe (KIT-074; KIT-085: no project
# justfile). The spec-tools action exports AI_KIT_DIR, the kit at the commit it pins (KIT-081: no copy in the project). The `changes` job decides what
# the diff needs: a docs-only diff skips build and tests, and dependency-check runs only when the
# build files change; a diff it cannot compute (schedule, workflow_dispatch, new branch) runs
# everything (fail-open).

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '25'
    secrets:
      NVD_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  changes:
    # GitHub counts a skipped job as success for a required check; this job is required itself because
    # a job skipped after a failed `needs` also reports success.
    runs-on: ubuntu-latest
    timeout-minutes: 5  # KIT-076: 3 × the longest measured green run (40 s), rounded up to 5 min
    outputs:
      code: ${{ steps.diff.outputs.code }}
      deps: ${{ steps.diff.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          range=""
          if [ "$EVENT" = pull_request ]; then range="$PR_BASE...$PR_HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then range="$BEFORE..$AFTER"
          fi
          if [ -n "$range" ] && files=$(git diff --name-only "$range"); then
            printf '%s\n' "$files"
            docs='(^|/)[^/]+\.md$|^docs/|^changelog\.d/|^\.github/ISSUE_TEMPLATE/|^\.github/CODEOWNERS$|^LICENSE'
            # here-strings, not pipes: with pipefail, `grep -q` closing early can SIGPIPE the writer
            code=false; grep -Evq "$docs" <<< "$files" && code=true
            deps=false; grep -Eq '^pom\.xml$|^\.mvn/|^mvnw(\.cmd)?$|^dependency-check-suppressions\.xml$|^\.github/workflows/' <<< "$files" && deps=true
            echo "code=$code" >> "$GITHUB_OUTPUT"
            echo "deps=$deps" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no diff range for '$EVENT' — running every job"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "deps=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # KIT-076: 3 × the longest measured green run (105 s), rounded up to 5 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: The pinned kit, home of the recipe modules (AI_KIT_DIR; KIT-085)
        uses: ChristianPrzybulinski/agent-rules-kit/platforms/ci/actions/spec-tools@758a7fcf37046aa010f402c7043cdc71342e243a  # v18.2.0
        with:
          checks: none
      - name: Install just (pinned, sha-256 checked; it runs the kit's recipes)
        env:
          JUST_VERSION: 1.58.0
          JUST_SHA256: 4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
        run: |
          set -euo pipefail
          wget -q -O "$RUNNER_TEMP/just.tar.gz" \
            "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$JUST_SHA256  $RUNNER_TEMP/just.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/just-bin"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/just-bin" just
          echo "$RUNNER_TEMP/just-bin" >> "$GITHUB_PATH"
      - name: Spotless + verify (the verify recipe; tests, JaCoCo, PITest in the domain module)
        env:
          MVN_FLAGS: -B -ntp
        run: just -f "$AI_KIT_DIR/platforms/kits/just/java.just" -d . verify
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore
      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pit-report
          path: '**/target/pit-reports/'
          if-no-files-found: ignore

  dependency-check:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    # KIT-076: GitHub's 360-minute job limit; 3 × the longest measured green run (13,987 s, a cold NVD sync) exceeds it
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Restore dependency-check NVD data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-dc-nvd-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-dc-nvd-
      - name: The pinned kit, home of the recipe modules (AI_KIT_DIR; KIT-085)
        uses: ChristianPrzybulinski/agent-rules-kit/platforms/ci/actions/spec-tools@758a7fcf37046aa010f402c7043cdc71342e243a  # v18.2.0
        with:
          checks: none
      - name: Install just (pinned, sha-256 checked; it runs the kit's recipes)
        env:
          JUST_VERSION: 1.58.0
          JUST_SHA256: 4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
        run: |
          set -euo pipefail
          wget -q -O "$RUNNER_TEMP/just.tar.gz" \
            "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$JUST_SHA256  $RUNNER_TEMP/just.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/just-bin"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/just-bin" just
          echo "$RUNNER_TEMP/just-bin" >> "$GITHUB_PATH"
      - name: OWASP dependency-check (the dependency-check recipe; fails on CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          MVN_FLAGS: -B -ntp
        # The recipe pins the plugin version: the mojo must support nvdApiKeyEnvironmentVariable.
        run: just -f "$AI_KIT_DIR/platforms/kits/just/java.just" -d . dependency-check
      - name: Save dependency-check NVD data
        # Save even when the gate fails on a real CVE: the full NVD sync costs
        # up to ~4h on a cold cache (13,987 s measured) and a red run must not throw it away.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-dc-nvd-${{ github.run_id }}
