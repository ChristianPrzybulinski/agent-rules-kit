name: pr-contract

# The no-model PR gates (agent-rules-kit platforms/ci/validations/pr_gates.py) as a reusable CI check.
# pr_gates.py comes from the kit commit the spec-tools action pins (KIT-081: no copy in a project);
# the action exports AI_KIT_DIR, the kit at that commit. The gates config stays in the gates
# repository, checked out at a protected ref. The report reads the PR, its
# `Closes <owner>/<backlog_repo>#N` issue and the head's checks through the REST API with
# GATES_TOKEN — a PR repo's GITHUB_TOKEN cannot read the backlog's issues, and the token is also the
# checkout credential when the gates repository is private. The proof commands are only extracted
# here — each caller's own `proof` job runs them with its toolchain. The human merge gate (a commit
# status such as the config's `review_context`) stays in place until the owner trusts this check.
# Dependabot or Renovate bumps the action's pin when the kit releases (agent-rules-kit
# platforms/kits/github/README.md).

on:
  workflow_call:
    inputs:
      repo:
        description: "the PR's repository name — a key of the gates config's `repos`"
        required: true
        type: string
      gates-repo:
        description: >-
          owner/name of the repository holding the gates config — usually the spec/backlog repo.
          Checked out at `gates-ref`.
        required: true
        type: string
      gates-ref:
        description: >-
          ref to read the gates config from. Keep a protected ref: the job holds GATES_TOKEN, so it
          must never read a config from an unreviewed PR head.
        required: false
        default: "main"
        type: string
      config:
        description: "path of the gates config JSON inside gates-repo (see pr_gates.py's docstring)"
        required: false
        default: ".github/pr-gates.json"
        type: string
    secrets:
      GATES_TOKEN:
        required: true
    outputs:
      proof-commands:
        description: "the PR's allowlisted proof commands, one per line (empty on no-task or no proof block)"
        value: ${{ jobs.contract.outputs.proof-commands }}

permissions: {}

jobs:
  contract:
    # GITHUB_TOKEN gets nothing: checkout and every API read go through GATES_TOKEN.
    permissions: {}
    if: github.event.pull_request.number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5  # KIT-076: 3 × the longest measured green run (42 s), rounded up to 5 min
    outputs:
      proof-commands: ${{ steps.commands.outputs.value }}
    steps:
      - name: Check out the gates repository (the gates config)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.gates-repo }}
          ref: ${{ inputs.gates-ref }}
          path: .gates
          token: ${{ secrets.GATES_TOKEN }}
          persist-credentials: false  # the API reads below pass GATES_TOKEN as GH_TOKEN
      # Python 3.12 and AI_KIT_DIR, the kit at the pinned commit, whose pr_gates.py the steps below run.
      - name: The kit's spec tools at the pinned commit (pr_gates.py)
        uses: ChristianPrzybulinski/agent-rules-kit/platforms/ci/actions/spec-tools@776d6ce381f89bfc12b4ca17f2b35577346ef37a  # v14.0.0
        with:
          checks: none
      - name: Gate report (step summary + job result)
        env:
          GH_TOKEN: ${{ secrets.GATES_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GATES_CONFIG: ${{ inputs.config }}
          GATES_REPO_KEY: ${{ inputs.repo }}
        shell: bash
        run: |
          set -o pipefail
          python3 "$AI_KIT_DIR/platforms/ci/validations/pr_gates.py" --config ".gates/$GATES_CONFIG" \
            --repo "$GATES_REPO_KEY" --pr "$PR_NUMBER" | tee "$GITHUB_STEP_SUMMARY"
      - name: Extract the proof commands for the caller's `proof` job
        id: commands
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GATES_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GATES_CONFIG: ${{ inputs.config }}
          GATES_REPO_KEY: ${{ inputs.repo }}
        shell: bash
        run: |
          eof="proof-commands-$RANDOM$RANDOM"
          python3 "$AI_KIT_DIR/platforms/ci/validations/pr_gates.py" --config ".gates/$GATES_CONFIG" \
            proof-commands --repo "$GATES_REPO_KEY" --pr "$PR_NUMBER" > .proof-commands
          { echo "value<<$eof"; cat .proof-commands; echo "$eof"; } >> "$GITHUB_OUTPUT"
