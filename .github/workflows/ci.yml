name: ci

# KIT-076: every pull request to main, every push to main and on demand. The `ci` job is a required check beside the
# independent review READY; green CI alone never merges. pull_request, never pull_request_target: a fork's pull request
# runs with a read-only token and no secrets.
# KIT-077: the pull request layers run as parallel jobs. `ci` waits for static, unit and the integration shards and
# passes only when each of them passed (it runs even when one failed, so it never reports a skip as a success). red is
# its own check. The whole integration layer and the functional layer run in ci-full.yml (push to main, nightly, the
# release commit), the performance layer in performance.yml. Locally: platforms/tools/run_tests.py --help.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 5  # KIT-077: 3 × the longest measured green run, rounded up to 5 min (the record lists the runs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -x platforms/tools/*.sh platforms/kits/*/*.sh platforms/kits/*/scripts/*.sh
      - name: install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: check kit (check_kit.py with links, gen_index.py --check, claude plugin validate)
        run: platforms/tools/check.sh --links

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5  # KIT-077: 3 × the longest measured green run, rounded up to 5 min (the record lists the runs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - name: unit and contract tests
        run: python3 -B platforms/tools/run_tests.py --layer unit,contract --durations 10

  integration:
    name: integration (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15  # KIT-077: 3 × the longest measured green run, rounded up to 5 min (the record lists the runs)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2  # HEAD^1: the base of a pull request's merge commit, or the commit before a push
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - name: install just and gitleaks (pinned, sha-256 checked; their tests fail instead of skipping under CI)
        env:
          JUST_VERSION: 1.58.0
          JUST_SHA256: 4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          wget -q -O "$RUNNER_TEMP/just.tar.gz" \
            "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
          wget -q -O "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$JUST_SHA256" "$RUNNER_TEMP/just.tar.gz" "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/bin" just
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: integration tests the change reaches (a dispatch runs them all)
        env:
          SHARD: ${{ matrix.shard }}/3
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          changed=()
          if [ "$EVENT" != workflow_dispatch ]; then changed=(--changed-from HEAD^1); fi
          python3 -B platforms/tools/run_tests.py --layer integration "${changed[@]}" --shard "$SHARD" --durations 10

  red:
    # The PR's new tests run on the base code (review_checks.py red); the job summary records the verdict for the
    # reviewer. Not part of `ci`: making it a required check is the coordinator's call (KIT-077).
    name: red
    runs-on: ubuntu-latest
    timeout-minutes: 30  # KIT-077: no green run measured yet; a PR that changes every test module runs them twice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # red diffs base...head and checks both out as worktrees
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - name: install just and gitleaks (pinned, sha-256 checked; their tests fail instead of skipping under CI)
        env:
          JUST_VERSION: 1.58.0
          JUST_SHA256: 4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          wget -q -O "$RUNNER_TEMP/just.tar.gz" \
            "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
          wget -q -O "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$JUST_SHA256" "$RUNNER_TEMP/just.tar.gz" "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/bin" just
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: red check
        run: python3 -B platforms/tools/ci_red.py

  ci:
    name: ci  # the required check context (KIT-076): a rename leaves the ruleset waiting for "ci" forever
    needs: [static, unit, integration]
    if: always()  # a skipped required job reports success, so `ci` runs and fails when a layer did not pass
    runs-on: ubuntu-latest
    timeout-minutes: 5  # KIT-077: 3 × the longest measured green run, rounded up to 5 min (the record lists the runs)
    steps:
      - name: every pull request layer passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: need["result"] for job, need in json.loads(os.environ["NEEDS"]).items()}
          for job, result in sorted(results.items()):
              print(f"{job}: {result}")
          sys.exit(0 if results and all(result == "success" for result in results.values()) else 1)
          PY

  workflow-lint:
    # actionlint and zizmor (default persona) over the kit's workflows and the templates projects copy (KIT-076);
    # a finding fails the job. Locally: zizmor .github/workflows/*.yml platforms/kits/github/workflows/*.yml
    name: workflow-lint  # the required check context (KIT-076)
    runs-on: ubuntu-latest
    timeout-minutes: 5  # KIT-076: 3 × the longest measured green run, rounded up to 5 min (the record lists the runs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: install actionlint and zizmor (pinned, sha-256 checked)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ZIZMOR_VERSION: 1.32.0
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/zizmor"
          wget -q -O "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          wget -q -O "$RUNNER_TEMP/zizmor.tar.gz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v$ZIZMOR_VERSION/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" "$ZIZMOR_SHA256" "$RUNNER_TEMP/zizmor.tar.gz" \
            | sha256sum -c -
          for tool in actionlint zizmor; do
            tar -xzf "$RUNNER_TEMP/$tool.tar.gz" -C "$RUNNER_TEMP/$tool"
            install -m 0755 "$(find "$RUNNER_TEMP/$tool" -type f -name "$tool" -print -quit)" "$RUNNER_TEMP/bin/$tool"
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: actionlint (shellcheck on run scripts included)
        run: actionlint -color .github/workflows/*.yml platforms/kits/github/workflows/*.yml
      - name: zizmor (online audits read public action metadata with the read-only token)
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format plain .github/workflows/*.yml platforms/kits/github/workflows/*.yml
