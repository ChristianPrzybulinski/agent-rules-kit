name: ci

on: [push, pull_request]

env:
  CI: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck platforms/tools/*.sh platforms/kits/*/*.sh platforms/kits/*/scripts/*.sh
      - name: install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: check kit
        run: platforms/tools/check.sh
      - name: check_spec self-test
        run: python3 -B -m unittest discover -s platforms/ci/validations -p "test_*.py"  # -B: no __pycache__ for check_kit
      - name: smoke
        run: platforms/tools/smoke.sh
      - name: links
        run: python3 platforms/ci/validations/check_kit.py --links
