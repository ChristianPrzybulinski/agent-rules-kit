name: ci

# KIT-076: every pull request to main, every push to main and on demand. The `ci` job is a required check beside the
# independent review READY; green CI alone never merges. pull_request, never pull_request_target: a fork's pull request
# runs with a read-only token and no secrets.
# KIT-077: the pull request layers run as parallel jobs. `ci` waits for static, unit, the integration shards and red
# and passes only when each of them passed (it runs even when one failed, so it never reports a skip as a success).
# The whole integration layer and the functional layer run in ci-full.yml (push to main, nightly, the
# release commit), the performance layer in performance.yml. Locally: platforms/tools/run_tests.py --help.
# pull_request keeps its default types, without `edited` (#279): a title or body edit would re-run every required job,
# and a job skipped on that event would report success; a PR retargeted to main waits for its next push, and red reads
# the current body whenever it runs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 5  # KIT-077: 3 × the longest measured green run, rounded up to 5 min (the record lists the runs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2  # HEAD^1: check_changelog.py diffs CHANGELOG.md against the merge commit's base (KIT-109)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -x platforms/tools/*.sh platforms/kits/*/*.sh platforms/kits/*/scripts/*.sh
      - name: install Claude Code (pinned, sha-256 checked; the stable channel's 2026-10-26 build; check.sh runs claude plugin validate)
        env:
          CLAUDE_CODE_VERSION: 2.1.311
          CLAUDE_CODE_SHA256: 86dc1fcc69498159eaf15f446613e847010f9036bfbbdffd4c49350be8489ada
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          wget -q -O "$RUNNER_TEMP/bin/claude" \
            "https://downloads.claude.ai/claude-code-releases/$CLAUDE_CODE_VERSION/linux-x64/claude"
          echo "$CLAUDE_CODE_SHA256  $RUNNER_TEMP/bin/claude" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/claude"
          "$RUNNER_TEMP/bin/claude" --version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: check kit (check_kit.py with links, gen_index.py --check, claude plugin validate)
        run: platforms/tools/check.sh --links

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5  # KIT-077: 3 × the longest measured green run, rounded up to 5 min (the record lists the runs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - name: install gdtoolkit (the Godot kit's pin; the GDScript tool tests fail instead of skipping under CI)
        run: pip install -r platforms/kits/godot/requirements-gdtoolkit.txt
      - name: unit and contract tests
        run: python3 -B platforms/tools/run_tests.py --layer unit,contract --durations 10

  integration:
    name: integration (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15  # KIT-077: 3 × the longest measured green run, rounded up to 5 min (the record lists the runs)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2  # HEAD^1: the base of a pull request's merge commit, or the commit before a push
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - name: install gdtoolkit (the Godot kit's pin; the GDScript tool tests fail instead of skipping under CI)
        run: pip install -r platforms/kits/godot/requirements-gdtoolkit.txt
      - name: install just and gitleaks (pinned, sha-256 checked; their tests fail instead of skipping under CI)
        env:
          JUST_VERSION: 1.58.0
          JUST_SHA256: 4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          wget -q -O "$RUNNER_TEMP/just.tar.gz" \
            "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
          wget -q -O "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$JUST_SHA256" "$RUNNER_TEMP/just.tar.gz" "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/bin" just
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: integration tests the change reaches (a dispatch runs them all)
        env:
          SHARD: ${{ matrix.shard }}/3
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          changed=()
          if [ "$EVENT" != workflow_dispatch ]; then changed=(--changed-from HEAD^1); fi
          python3 -B platforms/tools/run_tests.py --layer integration "${changed[@]}" --shard "$SHARD" --durations 10

  spec-tools-container:
    # #372: the spec-tools action in the container a Godot project's CI runs it in (ci-godot.yml), pinned by digest.
    # There the setup-python build cannot import ssl (the image's OpenSSL 3.0.13 lacks the OPENSSL_3.3.0 symbols the
    # build needs), so pip cannot reach PyPI and the action takes the distribution's python3-yaml and python3-jsonschema;
    # the spec and trace checks then run in full on the kit's own docs/spec. Part of `ci`.
    name: spec-tools-container
    runs-on: ubuntu-latest
    timeout-minutes: 5  # #372: 3 × the longest measured green run, rounded up to 5 min (the PR lists the runs)
    container: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # zizmor's self-repository audit asks for `$/`, which the pinned actionlint 1.7.12 refuses; `./` is the checkout,
      # this commit, which is what the job tests.
      - name: the spec-tools action from this commit, spec and trace checks  # zizmor: ignore[self-repository]
        uses: ./platforms/ci/actions/spec-tools
        with:
          checks: spec,trace
          base: ''
      - name: the checks ran on an interpreter with yaml and jsonschema; say when the image no longer lacks ssl
        shell: bash
        run: |
          set -euo pipefail
          "$AI_KIT_PYTHON" -c 'import yaml, jsonschema, ssl; print("AI_KIT_PYTHON:", __import__("sys").executable)'
          if python3 -c 'import ssl' 2>/dev/null; then
            echo "::warning::#372 fixture: the setup-python build imports ssl in this image now, so this job no longer exercises the action's apt-get fallback (the unit tests in test_spec_tools_action.py still pin it)"
          elif [ "$AI_KIT_PYTHON" != /usr/bin/python3 ]; then
            echo "::error::#372 fixture: python3 cannot import ssl here, yet the action exported AI_KIT_PYTHON=$AI_KIT_PYTHON instead of /usr/bin/python3"
            exit 1
          fi

  red:
    # The PR's new tests run on the base code (review_checks.py red); the job summary records the verdict for the
    # reviewer. Part of `ci` (KIT-077, #281): OK, EXEMPT, FLAG and a NONE with a ## Red exception pass, a FAIL fails.
    name: red
    runs-on: ubuntu-latest
    timeout-minutes: 25  # 3 × the longest measured green run (460 s, run 43817751313), rounded up to 5 min (#294)
    permissions:
      contents: read
      pull-requests: read  # ci_red.py reads the PR body when it runs, so a re-run sees an edited ## Red (#294)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # red diffs base...head and checks both out as worktrees
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - name: install gdtoolkit (the Godot kit's pin; the GDScript tool tests fail instead of skipping under CI)
        run: pip install -r platforms/kits/godot/requirements-gdtoolkit.txt
      - name: install just and gitleaks (pinned, sha-256 checked; their tests fail instead of skipping under CI)
        env:
          JUST_VERSION: 1.58.0
          JUST_SHA256: 4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          wget -q -O "$RUNNER_TEMP/just.tar.gz" \
            "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
          wget -q -O "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$JUST_SHA256" "$RUNNER_TEMP/just.tar.gz" "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/bin" just
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: red check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B platforms/tools/ci_red.py

  ci:
    name: ci  # the required check context (KIT-076): a rename leaves the ruleset waiting for "ci" forever
    needs: [static, unit, integration, spec-tools-container, red]
    if: always()  # a skipped required job reports success, so `ci` runs and fails when a layer did not pass
    runs-on: ubuntu-latest
    timeout-minutes: 5  # KIT-077: 3 × the longest measured green run, rounded up to 5 min (the record lists the runs)
    steps:
      - name: every pull request layer passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: need["result"] for job, need in json.loads(os.environ["NEEDS"]).items()}
          for job, result in sorted(results.items()):
              print(f"{job}: {result}")
          sys.exit(0 if results and all(result == "success" for result in results.values()) else 1)
          PY

  workflow-lint:
    # actionlint and zizmor (default persona) over the kit's workflows and the templates projects copy (KIT-076), and
    # zizmor over the composite actions projects pin (KIT-081; actionlint reads workflows only); a finding fails the
    # job. Locally: zizmor .github/workflows/*.yml platforms/kits/github/workflows/*.yml platforms/ci/actions/*/action.yml
    name: workflow-lint  # the required check context (KIT-076)
    runs-on: ubuntu-latest
    timeout-minutes: 5  # KIT-076: 3 × the longest measured green run, rounded up to 5 min (the record lists the runs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: install actionlint and zizmor (pinned, sha-256 checked)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ZIZMOR_VERSION: 1.32.0
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/zizmor"
          wget -q -O "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          wget -q -O "$RUNNER_TEMP/zizmor.tar.gz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v$ZIZMOR_VERSION/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" "$ZIZMOR_SHA256" "$RUNNER_TEMP/zizmor.tar.gz" \
            | sha256sum -c -
          for tool in actionlint zizmor; do
            tar -xzf "$RUNNER_TEMP/$tool.tar.gz" -C "$RUNNER_TEMP/$tool"
            install -m 0755 "$(find "$RUNNER_TEMP/$tool" -type f -name "$tool" -print -quit)" "$RUNNER_TEMP/bin/$tool"
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: actionlint (shellcheck on run scripts included)
        run: actionlint -color .github/workflows/*.yml platforms/kits/github/workflows/*.yml
      - name: zizmor (online audits read public action metadata with the read-only token)
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format plain .github/workflows/*.yml platforms/kits/github/workflows/*.yml platforms/ci/actions/*/action.yml
