name: ci

# KIT-076: every pull request to main, every push to main and on demand. The job is a required check beside the
# independent review READY; green CI alone never merges. pull_request, never pull_request_target: a fork's pull request
# runs with a read-only token and no secrets.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"

jobs:
  check:
    name: ci  # the required check context (KIT-076): a rename leaves the ruleset waiting for "ci" forever
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -x platforms/tools/*.sh platforms/kits/*/*.sh platforms/kits/*/scripts/*.sh
      - name: install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: check kit
        run: platforms/tools/check.sh
      - name: check_spec self-test
        run: python3 -B -m unittest discover -s platforms/ci/validations -p "test_*.py"  # -B: no __pycache__ for check_kit
      - name: smoke
        run: platforms/tools/smoke.sh
      - name: links
        run: python3 platforms/ci/validations/check_kit.py --links
