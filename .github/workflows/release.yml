name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # KIT-076: 3 × the longest measured green run (13 s), rounded up to 5 min
    permissions:
      contents: write  # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Tag == VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(cat VERSION)"
          [ "$tag" = "$ver" ] || { echo "::error::tag $tag != VERSION $ver"; exit 1; }
      - name: Extract CHANGELOG section
        run: |
          awk -v t="${GITHUB_REF_NAME#v}" 'index($0, "## [" t "]") == 1 {f=1} f && NR>1 && /^## \[/ && index($0, "## [" t "]") != 1 {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::section ## [${GITHUB_REF_NAME#v}] not found in CHANGELOG"; exit 1; }
          cat notes.md
      - name: gh release create
        run: gh release create "$GITHUB_REF_NAME" --notes-file notes.md --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
