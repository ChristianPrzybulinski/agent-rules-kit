name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    # KIT-076: 3 × the longest measured green run (13 s), rounded up to 5 min; KIT-077 adds the guard's wait for a
    # ci-full run on the tagged commit that is not created, queued or in progress yet (up to 20 min)
    timeout-minutes: 30
    permissions:
      contents: write  # gh release create
      actions: read  # the guard reads the ci-full runs of the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: ci-full passed on the tagged commit (KIT-077), else no release (the tag stays; re-run once it is green)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: python3 -B platforms/tools/release_guard.py --repo "$REPO" --sha "$SHA" --tag "$TAG" --wait 20
      - name: Tag == VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(cat VERSION)"
          [ "$tag" = "$ver" ] || { echo "::error::tag $tag != VERSION $ver"; exit 1; }
      - name: Extract CHANGELOG section
        run: |
          awk -v t="${GITHUB_REF_NAME#v}" 'index($0, "## [" t "]") == 1 {f=1} f && NR>1 && /^## \[/ && index($0, "## [" t "]") != 1 {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::section ## [${GITHUB_REF_NAME#v}] not found in CHANGELOG"; exit 1; }
          cat notes.md
      - name: gh release create
        run: gh release create "$GITHUB_REF_NAME" --notes-file notes.md --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # KIT-081: every install follows the stable branch; force=false refuses a move that is not a fast-forward
      - name: Move stable to the released commit (KIT-081), fast-forward only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: gh api -X PATCH "repos/$REPO/git/refs/heads/stable" -f sha="$SHA" -F force=false
