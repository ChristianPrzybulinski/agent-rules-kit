name: evals
# Manual only: the runs bill the Anthropic API and need the ANTHROPIC_API_KEY secret, which is not set.
on:
  workflow_dispatch:
jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The target is plugins/, not plugins/<p>: a dev or sdd case lists ../../../core in its plugins: frontmatter,
      # which loads only from inside the target directory.
      - name: eval
        run: |
          claude plugin eval plugins --trust-plugin --scaffold --allow-tools Bash Edit Write --tag ready \
            --ablation with-without --threshold 0.8 --model claude-sonnet-5-5 --judge-model claude-haiku-4-5 \
            --no-publish --max-cost-usd 20 --output-dir eval-results --json results.json --report report.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evals
          path: |
            results.json
            report.html
