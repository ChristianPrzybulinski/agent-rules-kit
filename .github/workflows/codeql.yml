name: codeql

# KIT-076: every pull request to main, every push to main and on demand; both matrix jobs are required checks. CodeQL
# advanced setup (KIT-063): python and actions with build-mode none; default setup stays off, since GitHub rejects the
# advanced-setup SARIF upload while it is on.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (${{ matrix.language }})  # the required check contexts (KIT-076): "codeql (python)", "codeql (actions)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # upload the SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        # java-kotlin is detected only from platforms/kits/docker/Dockerfile.java, a Dockerfile; CodeQL has no shell support
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: /language:${{ matrix.language }}
