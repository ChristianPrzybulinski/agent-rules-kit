name: devin-plugin

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: devin-plugin
  cancel-in-progress: false

env:
  CI: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - name: check kit
        run: platforms/tools/check.sh
      - name: build plugin
        run: platforms/install/devin-plugin.sh "$RUNNER_TEMP/plugin"
      - name: publish to devin-plugin branch
        working-directory: ${{ runner.temp }}/plugin
        run: |
          git init -q -b devin-plugin
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "build: ai-kit $(jq -r .version .devin-plugin/plugin.json) from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" devin-plugin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
