version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The workflow templates projects copy (KIT-076). For a directory other than "/", Dependabot reads every *.yml in
  # that folder (dependabot-core github_actions/file_fetcher.rb, `workflows_dir = "."`); GitHub's docs describe "/" only.
  - package-ecosystem: github-actions
    directory: /platforms/kits/github/workflows
    schedule:
      interval: weekly
  # The composite action projects pin by SHA (KIT-081): as above, Dependabot reads every *.yml there, action.yml too.
  - package-ecosystem: github-actions
    directory: /platforms/ci/actions/spec-tools
    schedule:
      interval: weekly
  # The gitleaks action projects pin by SHA (KIT-084): no action today (the CLI is pinned by version and sha-256 in its
  # install step), so a `uses:` it gains is watched from the start.
  - package-ecosystem: github-actions
    directory: /platforms/ci/actions/gitleaks
    schedule:
      interval: weekly
